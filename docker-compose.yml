version: '3.8'

services:
  db:
    image: postgres:15
    container_name: library2_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: lib_db
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: library2_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@db:5432/lib_db
    depends_on:
      - db